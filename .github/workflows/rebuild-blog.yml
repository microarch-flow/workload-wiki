name: Request unified blog rebuild

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  notify-blog:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send content-updated event
        env:
          WIKI_DISPATCH_TOKEN: ${{ secrets.WIKI_DISPATCH_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.request

          token = os.environ.get("WIKI_DISPATCH_TOKEN")
          if not token:
              print("::error::Missing WIKI_DISPATCH_TOKEN repository secret.", file=sys.stderr)
              sys.exit(1)

          payload = json.dumps({
              "event_type": "content-updated",
              "client_payload": {
                  "repository": os.environ["GITHUB_REPOSITORY"],
                  "sha": os.environ["GITHUB_SHA"],
              },
          }).encode("utf-8")
          request = urllib.request.Request(
              "https://api.github.com/repos/microarch-flow/wiki/dispatches",
              data=payload,
              method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": "Bearer " + token,
                  "Content-Type": "application/json",
                  "User-Agent": "workload-wiki-blog-sync",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )

          for attempt in range(3):
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      if response.status != 204:
                          raise RuntimeError("Unexpected GitHub API response status.")
                  print("Unified blog rebuild requested.")
                  break
              except urllib.error.HTTPError as error:
                  if error.code >= 500 and attempt < 2:
                      time.sleep(2 ** attempt)
                      continue
                  print(f"::error::GitHub dispatch failed (HTTP {error.code}); check the token permissions and expiry.", file=sys.stderr)
                  sys.exit(1)
              except (urllib.error.URLError, TimeoutError):
                  if attempt < 2:
                      time.sleep(2 ** attempt)
                      continue
                  print("::error::GitHub dispatch failed after network retries.", file=sys.stderr)
                  sys.exit(1)
          PY
